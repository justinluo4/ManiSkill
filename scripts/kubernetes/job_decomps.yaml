apiVersion: v1
kind: Pod
metadata:
  name: maniskill-decomps
  labels:
    app: maniskill
spec:
  restartPolicy: Never
  containers:
    - name: maniskill-runner
      image: gitlab-registry.nrp-nautilus.io/jluo2/ucsd:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: jluo-wandb
              key: WANDB_API_KEY
        - name: MANISKILL_REPO
          value: "https://github.com/justinluo4/ManiSkill.git"
        - name: MANISKILL_REF
          value: "main"
      args:
        - |
          set -euo pipefail
          echo "Starting ManiSkill PPO runs inside Kubernetes pod"
          
          # Clone ManiSkill repo if not already present
          if [ ! -d "/opt/ManiSkill" ]; then
            echo "Cloning ManiSkill repository..."
            git clone --depth 1 --branch "${MANISKILL_REF}" "${MANISKILL_REPO}" /opt/ManiSkill
          fi
          
          cd /opt/ManiSkill
          
          # Install dependencies
          echo "Installing ManiSkill dependencies..."
          pip install --upgrade pip
          pip install -e .
          pip install torch tensorboard
          
          # Download physx GPU binary via sapien
          echo "Downloading physx GPU binary..."
          python -c "exec('import sapien.physx as physx;\ntry:\n  physx.enable_gpu()\nexcept:\n  pass;')"
          mkdir -p /root/.maniskill/data/tasks/grasping/mani_skill2_ycb/models
          ln -s /data/models /root/.maniskill/data/tasks/grasping/mani_skill2_ycb/
          echo "Setup complete. Ready to run experiments."
          # exec bash
          sleep infinity
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: 1
          ephemeral-storage: 100Gi
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: 1
          ephemeral-storage: 100Gi
      volumeMounts:
        # 1. Mount the PVC to /data
        - name: persistent-storage
          mountPath: /data
        # 2. (Optional) Keep Shm for PyTorch speed
        - name: dshm
          mountPath: /dev/shm
        # 3. Keep existing workdir mount
        - name: workdir
          mountPath: /workspace
  volumes:
    # --- VOLUME DEFINITION ---
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: maniskill-pvc
    - name: dshm
      emptyDir:
        medium: Memory
    - name: workdir
      emptyDir: {}

