apiVersion: v1
kind: Pod
metadata:
  name: maniskill-decomps
  labels:
    app: maniskill
spec:
  restartPolicy: Never
  containers:
    - name: maniskill-runner
      image: gitlab-registry.nrp-nautilus.io/jluo2/ucsd:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail
          echo "Starting ManiSkill PPO runs inside Kubernetes pod"
          cd /opt/ManiSkill
          exec bash
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: 1
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: 1
      volumeMounts:
        - name: workdir
          mountPath: /workspace
  volumes:
    - name: workdir
      emptyDir: {}

