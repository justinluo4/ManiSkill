# debug-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: data-loader
spec:
  containers:
  - name: loader
    image: ubuntu
    command: ["/bin/bash", "-c", "sleep infinity"]
    volumeMounts:
    - mountPath: /data
      name: my-volume
  volumes:
  - name: my-volume
    persistentVolumeClaim:
      claimName: maniskill-pvc